<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chart move test</title>
<style>
  main { display: grid; grid-template-columns: 1fr 280px; gap: 1rem; padding: 0 1.2rem 1rem; align-items: start; }
  #chart-wrap { position: relative; background: #1d222b; border: 1px solid #2b323e;
    border-radius: 10px; height: min(70vh, 560px); padding: 1rem; }
  body { margin: 0; background: #14171c; }
  header { padding: 0.8rem 1.2rem; color: #dfe4ea; font-family: system-ui; }
</style>
</head>
<body>
<header>chart move test</header>
<main>
  <section id="chart-wrap"><canvas id="chart"></canvas></section>
  <aside></aside>
</main>
<script src="vendor/chart.umd.min.js"></script>
<script type="module">
  const mk = (id, label, unit, lo, hi, vals) => vals.map((v, i) => {
    const d = new Date(Date.UTC(2020, i, 10 + (i % 18)));
    return {
      analyteId: id, analyteLabel: label, value: v, bound: "",
      refLowN: lo, refHighN: hi, unit, date: d.toISOString().slice(0, 10),
    };
  });
  const rows = [
    ...mk("a", "Hemoglobin", "g/L", 120, 155,
      [129, 135, 157, 141, 138, 133, 140, 146, 131, 137, 144, 150]),
    ...mk("b", "Kreatinin", "µmol/L", 64, 104,
      [90, 93, 88, 95, 91, 89, 92, 97, 90, 94, 96, 93]),
    ...mk("c", "HDL koleszterin", "mmol/L", 1.05, 1.55,
      [1.31, 1.3, 1.4, 1.22, 1.45, 1.18, 1.25, 1.38, 1.2, 1.42, 1.31, 1.29]),
  ];
  const { buildSeries, renderChart } = await import("./js/chart-render.js");
  const series = buildSeries(rows, new Set(["a", "b", "c"]));
  const colors = { a: "#e3b341", b: "#4da3ff", c: "#66d17f" };
  series.forEach((s) => { s.color = colors[s.id] || "#e3b341"; });
  window.__chart = renderChart(document.getElementById("chart"), series);
</script>
</body>
</html>
